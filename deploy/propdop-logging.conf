# Keep the services' output across reboots.
#
# journald on this class of host is usually `Storage=volatile` -- a deliberate choice to
# spare the SD card -- so `journalctl` shows this boot and nothing before it. That is fine
# for watching a live problem and useless for the one that matters: a process that died in
# the night. These files sit beside the database, are capped by `propdop-logrotate.timer`,
# and need no root to set up.
#
# `%h` rather than a literal path, so the same drop-in works for any operator and the
# station's own directory layout stays out of the repository.
[Service]
ExecStartPre=/bin/mkdir -p %h/propdop/data/logs
StandardOutput=append:%h/propdop/data/logs/propdop.log
StandardError=append:%h/propdop/data/logs/propdop.log
